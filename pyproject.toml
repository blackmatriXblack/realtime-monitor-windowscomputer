[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-monitor"
version = "4.0.0"
description = "Comprehensive real-time Windows system monitoring with rolling log display"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Windows Monitor", email = "zeroprojectapex@foxmail.com"},
]
keywords = [
    "windows",
    "monitoring",
    "dns",
    "system",
    "security",
    "logging",
    "real-time",
    "cli",
    "tui",
    "monitor",
    "surveillance",
    "audit",
    "forensics",
    "event",
    "log",
    "process",
    "network",
    "registry",
    "wmi",
    "services",
    "firewall",
    "defender",
    "powershell",
    "active-directory",
    "iis",
    "sql",
    "hyper-v",
    "docker",
    "wsl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
exe = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/blackmatriXblack/realtime-monitor-windowscomputer"
Documentation = "https://github.com/blackmatriXblack/realtime-monitor-windowscomputer"
Repository = "https://github.com/blackmatriXblack/realtime-monitor-windowscomputer"
"Bug Tracker" = "https://github.com/blackmatriXblack/realtime-monitor-windowscomputer"
"Changelog" = "https://github.com/blackmatriXblack/realtime-monitor-windowscomputer"

[project.scripts]
windows-monitor = "windowsmonitor.__main__:main"
windows-monitor-gui = "windowsmonitor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
windowsmonitor = ["py.typed", "*.pyi", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["windowsmonitor"]
omit = ["*/tests/*", "*/test_*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401"]
